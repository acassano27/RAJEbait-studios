<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAJEbait Studios | Games</title>
    <meta
      name="description"
      content="Empty RAJEbait Studios game collection."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar container">
        <a class="brand-link" href="index.html" aria-label="RAJEbait Studios home page">
          <div class="brand-wrap">
            <div class="brand-mark">R</div>
            <div class="brand-copy">
              <span class="brand-name">RAJEbait</span>
              <span class="brand-sub">STUDIOS</span>
            </div>
          </div>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html#featured">Featured</a>
          <a href="index.html#categories">Categories</a>
          <a href="games.html" class="active">Games</a>
        </nav>

        <div class="header-actions">
          <button id="signInButton" class="ghost-btn" type="button">Sign in</button>
          <button id="playNowButton" class="primary-btn" type="button">Play now</button>
        </div>
      </header>

      <main class="container empty-page">
        <section class="empty-state" aria-live="polite">
          <p class="eyebrow">collection</p>
          <h1>No games added yet</h1>
          <p>This page is intentionally empty so new titles can be added later.</p>
          <div class="empty-actions">
            <a class="primary-btn" href="index.html">Back home</a>
            <button class="secondary-btn" id="browseCategoriesBtn" type="button">Browse categories</button>
          </div>
        </section>
      </main>
    </div>

    <div id="authModal" class="modal hidden" aria-hidden="true">
      <div class="modal-card">
        <button id="closeModal" class="close-btn" type="button" aria-label="Close sign in">×</button>
        <p class="eyebrow">account</p>
        <h2>Sign in</h2>
        <form id="authForm">
          <label>
            <span>Username</span>
            <input id="usernameInput" type="text" maxlength="24" placeholder="Enter a username" required />
          </label>
          <label>
            <span>Password</span>
            <input id="passwordInput" type="password" maxlength="24" placeholder="Enter a password" required />
          </label>
          <button class="primary-btn full-width" type="submit">Continue</button>
        </form>
        <p id="authMessage" class="auth-message" aria-live="polite"></p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
