<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAJEbait Studios | Games</title>
    <meta
      name="description"
      content="Browse RAJEbait Studios games by category."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=10" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar container">
        <a class="brand-link" href="index.html" aria-label="RAJEbait Studios home page">
          <div class="brand-wrap">
            <div class="brand-mark">R</div>
            <div class="brand-copy">
              <span class="brand-name">RAJEbait</span>
              <span class="brand-sub">STUDIOS</span>
            </div>
          </div>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html#featured">Featured</a>
          <a href="index.html#categories">Categories</a>
          <a href="games.html" class="active">Games</a>
        </nav>

        <div class="header-actions">
          <div class="balance-pill" aria-live="polite">
            <span>1000</span>
            <small>RAJE's</small>
          </div>
          <button id="restoreBalanceButton" class="ghost-btn" type="button" disabled>Restore +100</button>
          <button id="signInButton" class="ghost-btn" type="button">Sign in</button>
          <button id="playNowButton" class="primary-btn" type="button">Play now</button>
        </div>
      </header>

      <main class="container games-page catalog-page">
        <div class="catalog-heading">
          <div>
            <p class="eyebrow">game library</p>
            <h1>Find a game</h1>
          </div>
          <p class="catalog-count">4 games <span>·</span> 3 categories</p>
        </div>

        <nav class="category-jump" aria-label="Browse game categories">
          <a href="#category-gambling">Gambling <span>2</span></a>
          <a href="#category-games">Games <span>1</span></a>
          <a href="#category-puzzles">Puzzles &amp; Logic <span>1</span></a>
        </nav>

        <div class="catalog-list">
          <section class="catalog-section" id="category-gambling">
            <div class="catalog-section-heading">
              <h2>Gambling</h2>
              <span>2 games</span>
            </div>
            <div class="catalog-grid">
              <button class="catalog-game danger" type="button" data-game="Mines" data-category="Gambling" data-target="mines.html">
                <span class="tag">Strategy</span>
                <h3>Mines</h3>
                <small>Reveal safe tiles and cash out before a mine.</small>
                <span class="catalog-launch">Play game <span aria-hidden="true">→</span></span>
              </button>
              <button class="catalog-game danger" type="button" data-game="Roulette" data-category="Gambling" data-target="roulette.html">
                <span class="tag">Chance</span>
                <h3>Roulette</h3>
                <small>Place a bet on a color or number.</small>
                <span class="catalog-launch">Play game <span aria-hidden="true">→</span></span>
              </button>
            </div>
          </section>

          <section class="catalog-section" id="category-games">
            <div class="catalog-section-heading">
              <h2>Games</h2>
              <span>1 game</span>
            </div>
            <div class="catalog-grid">
              <button class="catalog-game" type="button" data-game="Tic Tac Toe" data-category="Games" data-target="tic-tac-toe.html">
                <span class="tag">Classic</span>
                <h3>Tic Tac Toe</h3>
                <small>Play a quick three-in-a-row match.</small>
                <span class="catalog-launch">Play game <span aria-hidden="true">→</span></span>
              </button>
            </div>
          </section>

          <section class="catalog-section" id="category-puzzles">
            <div class="catalog-section-heading">
              <h2>Puzzles &amp; Logic</h2>
              <span>1 game</span>
            </div>
            <div class="catalog-grid">
              <button class="catalog-game success" type="button" data-game="Number Ladder" data-category="Puzzles &amp; Logic" data-target="numberLadder/index.html">
                <span class="tag">Logic</span>
                <h3>Number Ladder</h3>
                <small>Crack the hidden three-digit code.</small>
                <span class="catalog-launch">Play game <span aria-hidden="true">→</span></span>
              </button>
            </div>
          </section>
        </div>
      </main>
    </div>

    <div id="authModal" class="modal hidden" aria-hidden="true">
      <div class="modal-card">
        <button id="closeModal" class="close-btn" type="button" aria-label="Close sign in">×</button>
        <p class="eyebrow">account</p>
        <h2 id="authTitle">Sign in</h2>
        <form id="authForm">
          <label>
            <span id="usernameLabel">Username</span>
            <input id="usernameInput" type="text" maxlength="24" placeholder="Enter username" required />
          </label>
          <label>
            <span id="passwordLabel">Password</span>
            <input id="passwordInput" type="password" maxlength="24" placeholder="Enter password" required />
          </label>
          <label id="confirmPasswordField" class="hidden" hidden style="display: none;">
            <span>Confirm password</span>
            <input id="confirmPasswordInput" type="password" maxlength="24" placeholder="Confirm password" />
          </label>
          <button id="authSubmitButton" class="primary-btn full-width" type="submit">Sign in</button>
        </form>
        <p id="authMessage" class="auth-message" aria-live="polite"></p>
        <button id="authSwitchButton" class="secondary-btn full-width auth-switch" type="button">Make account</button>
      </div>
    </div>

    <script src="script.js?v=11"></script>
  </body>
</html>
