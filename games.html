<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAJEbait Studios | Games</title>
    <meta
      name="description"
      content="Empty RAJEbait Studios game collection."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar container">
        <a class="brand-link" href="index.html" aria-label="RAJEbait Studios home page">
          <div class="brand-wrap">
            <div class="brand-mark">R</div>
            <div class="brand-copy">
              <span class="brand-name">RAJEbait</span>
              <span class="brand-sub">STUDIOS</span>
            </div>
          </div>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html#featured">Featured</a>
          <a href="index.html#categories">Categories</a>
          <a href="games.html" class="active">Games</a>
        </nav>

        <div class="header-actions">
          <div class="balance-pill" aria-live="polite">
            <span>1000</span>
            <small>RAJE's</small>
          </div>
          <button id="restoreBalanceButton" class="ghost-btn" type="button" disabled>Restore +100</button>
          <button id="signInButton" class="ghost-btn" type="button">Sign in</button>
          <button id="playNowButton" class="primary-btn" type="button">Play now</button>
        </div>
      </header>

      <main class="container games-page">
        <section class="game-layout">
          <div class="game-shell" aria-live="polite">
            <div class="game-header">
              <div>
                <p class="eyebrow">game room</p>
                <h1>Tic Tac Toe</h1>
              </div>
              <button id="tttReset" class="secondary-btn" type="button">New round</button>
            </div>

            <div class="ttt-mode-row">
              <button id="tttModeComputer" class="ttt-mode-btn active" type="button">vs Computer</button>
              <button id="tttModeTwoPlayer" class="ttt-mode-btn" type="button">2 Players</button>
            </div>

            <div id="tttStatus" class="game-status">Player X starts</div>

            <div id="ticTacToeBoard" class="tic-tac-toe-board" role="grid" aria-label="Tic Tac Toe board">
              <button class="ttt-cell" type="button" data-index="0" aria-label="Cell 1"></button>
              <button class="ttt-cell" type="button" data-index="1" aria-label="Cell 2"></button>
              <button class="ttt-cell" type="button" data-index="2" aria-label="Cell 3"></button>
              <button class="ttt-cell" type="button" data-index="3" aria-label="Cell 4"></button>
              <button class="ttt-cell" type="button" data-index="4" aria-label="Cell 5"></button>
              <button class="ttt-cell" type="button" data-index="5" aria-label="Cell 6"></button>
              <button class="ttt-cell" type="button" data-index="6" aria-label="Cell 7"></button>
              <button class="ttt-cell" type="button" data-index="7" aria-label="Cell 8"></button>
              <button class="ttt-cell" type="button" data-index="8" aria-label="Cell 9"></button>
            </div>

            <div class="game-actions">
              <button id="tttPlayAgain" class="primary-btn" type="button">Play again</button>
              <a class="secondary-btn" href="index.html">Back home</a>
              <button class="secondary-btn" id="browseCategoriesBtn" type="button">Browse categories</button>
            </div>
          </div>

          <aside class="mini-panel">
            <p class="eyebrow">wallet</p>
            <div id="accountSummary" class="mini-summary">Not signed in</div>
            <p class="mini-copy">Win a round for +50 RAJE's. Losses take 25 RAJE's from your active balance.</p>
          </aside>
        </section>
      </main>
    </div>

    <div id="authModal" class="modal hidden" aria-hidden="true">
      <div class="modal-card">
        <button id="closeModal" class="close-btn" type="button" aria-label="Close sign in">×</button>
        <p class="eyebrow">account</p>
        <h2 id="authTitle">Sign in</h2>
        <form id="authForm">
          <label>
            <span id="usernameLabel">Username</span>
            <input id="usernameInput" type="text" maxlength="24" placeholder="Enter username" required />
          </label>
          <label>
            <span id="passwordLabel">Password</span>
            <input id="passwordInput" type="password" maxlength="24" placeholder="Enter password" required />
          </label>
          <label id="confirmPasswordField" class="hidden" hidden style="display: none;">
            <span>Confirm password</span>
            <input id="confirmPasswordInput" type="password" maxlength="24" placeholder="Confirm password" />
          </label>
          <button id="authSubmitButton" class="primary-btn full-width" type="submit">Sign in</button>
        </form>
        <p id="authMessage" class="auth-message" aria-live="polite"></p>
        <button id="authSwitchButton" class="secondary-btn full-width auth-switch" type="button">Make account</button>
      </div>
    </div>

    <script src="script.js?v=6"></script>
  </body>
</html>
