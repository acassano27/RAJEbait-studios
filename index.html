<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAJEbait Blackjack</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-wrap">
        <div class="brand-icon">♠</div>
        <div>
          <div class="brand-kicker">RAJEbait Studios</div>
          <h1>Blackjack</h1>
        </div>
      </div>
      <div class="bank-wrap">
        <div class="bank-label">Bankroll</div>
        <div class="bank-value" id="bankroll">$500</div>
      </div>
    </header>

    <main class="game-card">
      <section class="table-top">
        <div class="game-status">
          <div class="status-chip" id="roundBadge">Round 1</div>
          <div class="status-text" id="statusText">Place your bet</div>
          <div class="lock-state unlocked" id="lockState">Bet unlocked</div>
        </div>

        <div class="bet-controls">
          <div class="bet-title-wrap">
            <label class="bet-label" for="betInput">Bet</label>
          </div>

          <div class="bet-input-group">
            <div class="bet-stepper">
              <button class="icon-button" id="minusBtn" aria-label="Lower bet">−</button>

              <div class="bet-display-wrap">
                <input type="number" id="betInput" min="25" max="250" value="50" />
                <div class="bet-display" id="betDisplay">$50</div>
              </div>

              <button class="icon-button" id="plusBtn" aria-label="Raise bet">+</button>
            </div>

            <div class="step-wrap">
              <label class="step-label" for="betStepInput">Step</label>
              <input type="number" id="betStepInput" min="1" value="25" />
            </div>
          </div>
        </div>
      </section>

      <section class="game-board">
        <section class="hand-panel dealer-panel">
          <div class="panel-title">
            <span>Dealer</span>
            <span class="score" id="dealerScore">?</span>
          </div>
          <div class="hand" id="dealerHand"></div>
        </section>

        <section class="hand-panel player-panel">
          <div class="panel-title">
            <span>Player</span>
            <span class="score" id="playerScore">?</span>
          </div>
          <div class="hand" id="playerHand"></div>
        </section>
      </section>

      <section class="control-strip">
        <button class="control-button primary-button" id="dealBtn">Deal</button>
        <button class="control-button" id="hitBtn" disabled>Hit</button>
        <button class="control-button" id="standBtn" disabled>Stand</button>
      </section>

      <section class="game-log-wrap">
        <div class="log-title">Table Log</div>
        <div class="game-log" id="gameLog">
          <div class="log-item">Welcome to the table.</div>
        </div>
      </section>
    </main>
  </div>

  <script src="game-system.js"></script>
  <script src="BlackJackScript.js"></script>
</body>
</html>
