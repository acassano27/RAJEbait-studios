<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAJEbait Studios | Roulette</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=2" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar container">
        <a class="brand-link" href="index.html" aria-label="RAJEbait Studios home page">
          <div class="brand-wrap">
            <div class="brand-mark">R</div>
            <div class="brand-copy">
              <span class="brand-name">RAJEbait</span>
              <span class="brand-sub">STUDIOS</span>
            </div>
          </div>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html#featured">Featured</a>
          <a href="index.html#categories">Categories</a>
          <a href="games.html">Games</a>
        </nav>
        <div class="header-actions">
          <div class="balance-pill" aria-live="polite"><span>1000</span><small>RAJE's</small></div>
          <button id="restoreBalanceButton" class="ghost-btn" type="button" disabled>Restore +100</button>
          <button id="signInButton" class="ghost-btn" type="button">Sign in</button>
        </div>
      </header>

      <main class="container games-page">
        <section class="game-layout">
          <div class="game-shell roulette-shell" aria-live="polite">
            <div class="game-header">
              <div>
                <p class="eyebrow">gambling room</p>
                <h1>Roulette</h1>
              </div>
              <a class="secondary-btn" href="index.html">Back home</a>
            </div>
            <div id="rouletteResult" class="roulette-result">Choose a bet to spin</div>
            <div class="roulette-wheel-frame">
              <div id="rouletteWheel" class="roulette-wheel" aria-label="Roulette wheel">
                <div class="roulette-labels" aria-hidden="true"></div>
                <span id="rouletteSelector" class="roulette-selector" aria-hidden="true"></span>
                <span id="rouletteWheelNumber">0</span>
              </div>
            </div>
            <form id="rouletteForm" class="roulette-form">
              <label>
                <span>Bet type</span>
                <select id="rouletteBetType">
                  <option value="red">Red</option>
                  <option value="black">Black</option>
                  <option value="green">Green</option>
                  <option value="number">Number</option>
                </select>
              </label>
              <label id="rouletteNumberField" class="hidden">
                <span>Number (0-36)</span>
                <input id="rouletteNumber" type="number" min="0" max="36" placeholder="0-36" />
              </label>
              <label>
                <span>Bet amount</span>
                <span class="amount-control">
                  <input id="rouletteBetAmount" type="number" min="1" step="1" placeholder="Enter RAJE's" required />
                  <span class="amount-stepper" aria-label="Adjust bet amount">
                    <button id="decreaseBetAmount" class="amount-step" type="button" aria-label="Decrease bet amount">−</button>
                    <button id="increaseBetAmount" class="amount-step" type="button" aria-label="Increase bet amount">+</button>
                  </span>
                </span>
              </label>
              <button class="primary-btn full-width" type="submit">Spin</button>
            </form>
          </div>
          <aside class="mini-panel">
            <p class="eyebrow">wallet</p>
            <div id="accountSummary" class="mini-summary">Not signed in</div>
            <p class="mini-copy">Red and black pay 1:1. Green and exact numbers pay 35:1.</p>
          </aside>
        </section>
      </main>
    </div>

    <div id="authModal" class="modal hidden" aria-hidden="true">
      <div class="modal-card">
        <button id="closeModal" class="close-btn" type="button" aria-label="Close sign in">×</button>
        <p class="eyebrow">account</p>
        <h2 id="authTitle">Sign in</h2>
        <form id="authForm">
          <label><span id="usernameLabel">Username</span><input id="usernameInput" type="text" maxlength="24" placeholder="Enter username" required /></label>
          <label><span id="passwordLabel">Password</span><input id="passwordInput" type="password" maxlength="24" placeholder="Enter password" required /></label>
          <label id="confirmPasswordField" class="hidden" hidden style="display: none;"><span>Confirm password</span><input id="confirmPasswordInput" type="password" maxlength="24" placeholder="Confirm password" /></label>
          <button id="authSubmitButton" class="primary-btn full-width" type="submit">Sign in</button>
        </form>
        <p id="authMessage" class="auth-message" aria-live="polite"></p>
        <button id="authSwitchButton" class="secondary-btn full-width auth-switch" type="button">Make account</button>
      </div>
    </div>
    <script src="script.js?v=8"></script>
  </body>
</html>
